spring:
  application:
    name: user-service

  cloud:
    loadbalancer:
      retry:
        enabled: true
    config:
      enabled: false
    discovery:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.cloud.netflix.eureka.EurekaClientAutoConfiguration
      - org.springframework.cloud.netflix.eureka.EurekaDiscoveryClientConfiguration

eureka:
  client:
    enabled: false
    registerWithEureka: false
    fetchRegistry: false