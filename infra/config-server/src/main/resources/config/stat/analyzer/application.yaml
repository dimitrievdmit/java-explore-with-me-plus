server:
  port: 0
spring:
  application:
    name: analyzer
  sql:
    init:
      mode: always
      continue-on-error: true
  datasource:
    url: jdbc:postgresql://localhost:5432/ewm_stats_db
    username: postgres
    password: 54321
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

kafka:
  bootstrap-servers: localhost:9092
  topics:
    user-actions: stats.user-actions.v1
    events-similarity: stats.events-similarity.v1
  consumer:
    actions-group-id: analyzer-user-actions
    similarity-group-id: analyzer-events-similarity
    auto-offset-reset: earliest

grpc:
  server:
    port: 0

recommendations:
  neighbor-count: 5

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
