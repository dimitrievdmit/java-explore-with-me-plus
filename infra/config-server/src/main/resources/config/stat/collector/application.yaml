server:
  port: 0
spring:
  application:
    name: collector

kafka:
  bootstrap-servers: localhost:9092
  topics:
    user-actions: stats.user-actions.v1
  producer:
    acks: all
    enable-idempotence: true

grpc:
  server:
    port: 0

eureka:
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
